name = "traverse_query"
max_turns = 20

prompt = """
btree.py is in the workspace. Write `test_btree.py` that thoroughly exercises it.

First write a `validate(tree)` function that checks B-tree invariants and raises
AssertionError with a descriptive message on any violation:
- All leaves at the same depth
- Every non-root node has at least t-1 keys (where t is the tree's minimum degree)
- Every node has at most 2t-1 keys
- Keys within each node are sorted strictly ascending
- For every internal node: all keys in child[i] < keys[i] < all keys in child[i+1]

Then run these test scenarios, calling validate() after every mutating operation:

1. Sequential insert: insert 1..20 in order. Check to_sorted_list() == list(range(1, 21)).

2. Reverse insert: fresh tree, insert 20..1 in reverse. Check to_sorted_list() is still sorted.

3. Random-ish insert: fresh tree, insert [10, 20, 5, 6, 12, 30, 7, 17, 3, 1].
   Verify search() returns True for all inserted keys and False for [0, 4, 11, 25].

4. Delete leaf keys: from tree in step 3, delete 1, 3, 6. Validate and check
   those keys are gone from to_sorted_list() and search() returns False for them.

5. Delete internal node keys: continue from step 4, delete 10 (likely an internal node
   after the previous insertions). Validate and verify 10 is gone.

6. Delete until empty: fresh tree with keys [5, 10, 15, 20]. Delete all four in that
   order. Verify to_sorted_list() == [] at the end.

7. Different t values: repeat scenario 3 with t=3. Validate the tree; check that
   internal nodes have at most 5 keys (2*3-1).

For each scenario print what you're testing, PASS or FAIL, and on failure the
specific assertion that broke. At the end print "X/Y scenarios passed".
"""
