[project]
name = "retreat-agent-stub"
version = "0.1.0"
description = "A tiny sandboxed LLM coding-agent framework (OpenAI + local vLLM) for the retreat."
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.0",
    "landlock>=1.0.0.dev5",
    "python-dotenv>=1.0",
    # candidate get_tree_model bodies (and the baselines they start from, e.g.
    # the MVAU baseline's np.prod(numInputVectors)) reference numpy; the local
    # oracle execs them on the host, so numpy must be importable there.
    "numpy>=1.21",
    # same reason as numpy: several baselines/candidates (e.g. Thresholding's
    # DataType[self.get_nodeattr("outputDataType")]) reference qonnx's DataType,
    # which the local oracle binds into the exec namespace.
    "qonnx>=0.2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_stub*"]
